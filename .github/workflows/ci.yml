name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fraudshield
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cases
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,api,production,explainability]
        pip install flake8 black

    - name: Lint and Format
      run: |
        flake8 src/ tests/ scripts/ || true
        black --check src/ tests/ scripts/ || true

    - name: Generate Synthetic Bundle
      run: |
        python scripts/generate_ci_bundle.py

    - name: Run Alembic Migrations
      env:
        FRAUDSHIELD_DATABASE_URL: postgresql://fraudshield:password@localhost:5432/cases
      run: |
        alembic upgrade head

    - name: Run Tests
      env:
        FRAUDSHIELD_DATABASE_URL: postgresql://fraudshield:password@localhost:5432/cases
      run: |
        pytest tests/

    - name: Docker Build and Compose Validation
      run: |
        docker compose config
        docker compose build
