[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield-ml"
version = "0.1.0"
description = "End-to-end financial transaction fraud detection pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "imbalanced-learn>=0.12,<1.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "jupyterlab>=4.2,<5.0",
    "PyYAML>=6.0,<7.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
boosting = [
    "lightgbm>=4.0",
    "optuna>=3.0"
]

[project.scripts]
fraudshield = "fraudshield.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fraudshield*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
