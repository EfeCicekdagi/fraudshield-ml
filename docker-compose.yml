version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fraudshield
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cases
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      - FRAUDSHIELD_DATABASE_URL=postgresql://fraudshield:password@postgres:5432/cases
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn fraudshield.api.app:create_app --host 0.0.0.0 --port 8000 --factory
    ports:
      - "8000:8000"
    environment:
      - FRAUDSHIELD_DATABASE_URL=postgresql://fraudshield:password@postgres:5432/cases
      - FRAUDSHIELD_API_KEY=test_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: .
    command: streamlit run src/fraudshield/dashboard/app.py --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - FRAUDSHIELD_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
